<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LibreLambda Academy</title><style>body{font-family:system-ui;background:#0b1120;color:#eef3ff;margin:0}header{padding:24px;background:#152039}main{max-width:900px;margin:auto;padding:22px}.card{background:#182844;border:1px solid #37506f;padding:20px;border-radius:14px;margin:15px 0}button,textarea,select{font:inherit;border-radius:9px;padding:10px}button{background:#2e6bd0;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}textarea{width:100%;box-sizing:border-box;background:#101b2b;color:#fff;min-height:140px}.choice{display:block;border:1px solid #446080;padding:12px;border-radius:8px;margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#091222;padding:15px;border-radius:8px}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{background:#314460}nav button.active{background:#2476c8}.muted{color:#b8c7df}@media(max-width:600px){header{padding:15px}main{padding:12px}.card{padding:14px}}</style></head><body><header><h1>☁️ LibreLambda Academy</h1><p>Aprendé AWS Lambda desde cero · Sin cuenta AWS</p></header><main><nav id="nav"></nav><div id="app"></div></main><script>
const lessons=[
{t:"La nube",d:"Los proveedores cloud ofrecen infraestructura y servicios informáticos a demanda.",q:[["¿Qué caracteriza al cómputo en la nube?",["Recursos disponibles a demanda","Computadoras sin procesadores","Solo software sin Internet"],0],["¿Cuál es un proveedor cloud?",["Un cable USB","Amazon Web Services","Una hoja de cálculo"],1],["¿Qué significa escalar?",["Cerrar la aplicación","Reducir la seguridad","Ajustar recursos según demanda"],2]]},
{t:"Serverless",d:"Serverless significa que el proveedor administra la infraestructura; los servidores siguen existiendo.",q:[["¿Qué administra AWS en Lambda?",["Los servidores subyacentes","Las contraseñas de tus usuarios","Tus algoritmos"],0],["¿Serverless elimina todos los servidores?",["Sí","No, abstrae su administración","Solo para Java"],1],["¿Qué ventaja ofrece?",["Impedir errores","Evitar pruebas","Desplegar lógica sin gestionar servidores"],2]]},
{t:"Funciones y runtimes",d:"El handler recibe eventos; el runtime permite ejecutar un lenguaje específico.",q:[["¿Qué recibe un handler?",["El teclado físico","Un evento","Una pantalla"],1],["¿Qué es un runtime?",["Un tipo de presupuesto","Un servicio de correo","El entorno de ejecución"],2],["¿Qué lenguaje admite Lambda?",["Python","Solamente CSS","Solamente HTML"],0]]},
{t:"Eventos JSON",d:"JSON permite representar objetos y datos enviados a una función.",q:[["¿Qué JSON es válido?",["{nombre:Ana}","{\"nombre\":\"Ana\"}","nombre=Ana"],1],["¿Qué representa event.nombre?",["Un dato del evento","La memoria física","El precio fijo de Lambda"],0],["¿Qué pasa con JSON inválido?",["Siempre funciona","Se corrige solo","Puede fallar el análisis"],2]]},
{t:"Invocaciones",d:"Una invocación es una solicitud para ejecutar una función; puede ser síncrona o asíncrona.",q:[["¿Qué es invocar una función?",["Comprar hardware","Solicitar su ejecución","Cambiar la región"],1],["¿HTTP 200 suele indicar?",["Operación exitosa","Acceso prohibido","Servidor inexistente"],0],["¿Qué sucede con un timeout?",["La memoria se duplica","La función se publica","La ejecución supera el límite"],2]]},
{t:"Disparadores",d:"API Gateway, S3 y EventBridge pueden iniciar flujos que involucren funciones Lambda.",q:[["¿Qué servicio expone endpoints HTTP?",["Amazon S3","CloudWatch","API Gateway"],2],["¿Qué evento puede provenir de S3?",["Subida de un archivo","Cambio de pantalla","Conexión de un mouse"],0],["¿Qué usarías para ejecuciones programadas?",["IAM","EventBridge Scheduler","Amazon VPC"],1]]},
{t:"IAM",d:"Una función usa un rol de ejecución para acceder a recursos autorizados.",q:[["¿Qué recomienda el mínimo privilegio?",["Acceso total","Credenciales públicas","Solo permisos necesarios"],2],["¿Qué determina el rol de ejecución?",["Permisos de acceso a servicios","Diseño gráfico","Idioma del navegador"],0],["¿Dónde NO guardar secretos reales?",["Un gestor de secretos","Código público","Servicio cifrado"],1]]},
{t:"Logs y errores",d:"Los registros y métricas facilitan el diagnóstico de fallas.",q:[["¿Qué ayuda a investigar un error?",["Logs de ejecución","Color del encabezado","Nombre del navegador"],0],["¿Qué mide la duración?",["Cantidad de alumnos","Tiempo de ejecución","Total de repositorios"],1],["¿Qué indica una excepción no controlada?",["Un resultado siempre exitoso","Un ahorro garantizado","Un fallo que investigar"],2]]},
{t:"Costos y métricas",d:"El precio de Lambda depende de invocaciones y recursos consumidos, entre otros factores.",q:[["¿Qué variable influye en el consumo?",["Color del botón","Memoria configurada y duración","Nombre del archivo"],1],["¿Qué métrica cuenta ejecuciones?",["Invocaciones","Colores","Usuarios de GitHub"],0],["¿Este simulador llama a AWS real?",["Siempre","Solo desde Android","No"],2]]}
];
let cur=0,idx=0,score=0,answered=false;const $=id=>document.getElementById(id);const safe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const shuffled=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let questions=[];function open(n){cur=n;idx=0;score=0;answered=false;questions=n<lessons.length?shuffled(lessons[n].q):[];if(n===10)questions=shuffled(lessons.flatMap((lesson,i)=>shuffled(lesson.q).slice(0,2).map(q=>({module:i,q}))));render()}function render(){$('nav').innerHTML=lessons.map((m,i)=>'<button class="'+(cur===i?'active':'')+'" data-i="'+i+'">'+(i+1)+'. '+safe(m.t)+'</button>').join('')+'<button class="'+(cur===9?'active':'')+'" data-i="9">🧪 Laboratorio</button><button class="'+(cur===10?'active':'')+'" data-i="10">🏆 Evaluación final</button>';$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>open(+b.dataset.i));if(cur===9)return lab();if(cur===10)return globalExam();let m=lessons[cur],q=questions[idx],opts=shuffled(q[1].map((text,i)=>({text,i})));$('app').innerHTML='<div class="card"><h2>'+safe(m.t)+'</h2><p>'+safe(m.d)+'</p></div><div class="card"><p class="muted">Pregunta '+(idx+1)+' de 3 · Aciertos: '+score+'</p><h3>'+safe(q[0])+'</h3>'+opts.map(o=>'<label class="choice"><input type="radio" name="a" value="'+o.i+'"> '+safe(o.text)+'</label>').join('')+'<button id="check">Comprobar</button> <button id="next" hidden>Siguiente →</button><p id="feedback" role="status"></p></div>';$('check').onclick=()=>{let a=document.querySelector('input[name=a]:checked');if(!a){$('feedback').textContent='Elegí una respuesta.';return}if(answered)return;answered=true;let ok=+a.value===q[2];if(ok)score++;$('feedback').textContent=ok?'✅ ¡Correcto!':'❌ La respuesta correcta es: '+q[1][q[2]];document.querySelectorAll('input[name=a]').forEach(x=>x.disabled=true);$('check').disabled=true;$('next').hidden=false};$('next').onclick=()=>{answered=false;idx++;if(idx>=3){const suggestions=[
'Explorá las diferencias entre IaaS, PaaS y servicios administrados en la nube.',
'Repasá qué tareas administra AWS y cuáles siguen siendo responsabilidad del desarrollador.',
'Practicá la relación entre handler, evento y runtime de una función.',
'Explorá objetos, cadenas y sintaxis válida de JSON.',
'Compará invocaciones síncronas, asíncronas y límites de ejecución.',
'Investigá cuándo usar API Gateway, S3 y EventBridge Scheduler.',
'Practicá cómo diseñar permisos IAM con el principio de mínimo privilegio.',
'Explorá registros de CloudWatch, excepciones y tiempos de ejecución.',
'Compará invocaciones, memoria configurada, duración y costos estimados.'
];const levels=[
{title:'Necesitás reforzar los conceptos básicos',msg:'Todavía hay conceptos importantes por descubrir. Repasá la explicación y los ejemplos antes de volver a intentar el cuestionario.',action:'Volver a estudiar el módulo'},
{title:'Vas por buen camino, pero conviene practicar más',msg:'Identificaste algunos conceptos, aunque todavía hay dudas. Explorá el tema con ejemplos y volvé a intentarlo.',action:'Practicar nuevamente'},
{title:'¡Buen trabajo! Podés seguir avanzando',msg:'Comprendiste la mayoría de los conceptos. Revisá el punto que fallaste para consolidar lo aprendido.',action:'Continuar aprendiendo'},
{title:'¡Excelente dominio del módulo!',msg:'Respondiste todo correctamente. Estás listo para relacionar estos conceptos con situaciones más complejas de AWS Lambda.',action:'Explorar el siguiente desafío'}
];const level=levels[score];const next=score>=2?Math.min(cur+1,9):cur;$('app').innerHTML='<div class="card"><p class="muted">Evaluación final · '+safe(lessons[cur].t)+'</p><h2>Resultado: '+score+' de 3 respuestas correctas ('+Math.round(score/3*100)+'%)</h2><h3>'+level.title+'</h3><p>'+level.msg+'</p><h3>📚 Recomendación personalizada</h3><p>'+safe(suggestions[cur])+'</p><p class="muted">'+(score>=2?'Módulo aprobado.':'Módulo por reforzar; podés intentarlo nuevamente.')+'</p><button id="continue">'+level.action+'</button> <button id="retry">Repetir evaluación</button></div>';$('continue').onclick=()=>open(next);$('retry').onclick=()=>open(cur)}else render()}}
function globalExam(){const total=questions.length;if(idx>=total){const correct=questions.filter(x=>x.correct).length;const pct=Math.round(correct/total*100);const records=lessons.map((m,i)=>{const picked=questions.filter(x=>x.module===i);return {name:m.t,hits:picked.filter(x=>x.correct).length,total:picked.length}});const strong=records.filter(x=>x.hits===x.total).map(x=>x.name);const needs=records.filter(x=>x.hits<x.total).map(x=>x.name);const title=pct>=85?'Excelente dominio general':pct>=65?'Buen avance: seguí profundizando':pct>=45?'Vas aprendiendo: necesitás reforzar algunos temas':'Conviene volver a los fundamentos';const desc=pct>=85?'Comprendés muy bien los conceptos principales. Como siguiente desafío, relacioná eventos, permisos y monitoreo en un caso práctico.':pct>=65?'Tenés una base sólida, aunque algunos conceptos todavía merecen práctica.':pct>=45?'Reconocés conceptos importantes, pero necesitás revisar varios módulos antes de avanzar.':'Te recomendamos repasar los primeros módulos y practicar con ejemplos antes de repetir la evaluación.';$('app').innerHTML='<div class="card"><h2>🏆 Resultado de la evaluación general</h2><h3>'+correct+' de '+total+' respuestas correctas · '+pct+'%</h3><h3>'+title+'</h3><p>'+desc+'</p><h3>✅ Temas dominados</h3><p>'+safe(strong.length?strong.join(', '):'Todavía no hay temas con todas las respuestas correctas. ¡Seguí practicando!')+'</p><h3>📚 Temas para explorar más</h3><p>'+safe(needs.length?needs.join(', '):'¡Muy bien! No hubo errores en los temas evaluados.')+'</p><h3>Resultados por módulo</h3>'+records.map(x=>'<p>'+safe(x.name)+': '+x.hits+'/'+x.total+'</p>').join('')+'<p class="muted">Evaluación formativa orientativa. Las preguntas se seleccionan aleatoriamente del banco disponible; no constituye una certificación AWS.</p><button id="repeat">Repetir evaluación con otras preguntas</button> <button id="study">Volver al primer módulo</button></div>';$('repeat').onclick=()=>open(10);$('study').onclick=()=>open(0);return}const item=questions[idx],q=item.q,opts=shuffled(q[1].map((label,i)=>({label,i})));$('app').innerHTML='<div class="card"><h2>🏆 Evaluación general de AWS Lambda</h2><p class="muted">18 preguntas de los nueve módulos · Pregunta '+(idx+1)+' de '+total+'</p><p><strong>Tema:</strong> '+safe(lessons[item.module].t)+'</p><h3>'+safe(q[0])+'</h3>'+opts.map(o=>'<label class="choice"><input type="radio" name="final-answer" value="'+o.i+'"> '+safe(o.label)+'</label>').join('')+'<button id="submit-final">Responder y continuar</button><p id="final-message" role="status"></p></div>';$('submit-final').onclick=()=>{const selected=document.querySelector('input[name="final-answer"]:checked');if(!selected){$('final-message').textContent='Elegí una respuesta para continuar.';return}item.correct=Number(selected.value)===q[2];idx++;globalExam()}}function lab(){$('app').innerHTML='<div class="card"><h2>🧪 Laboratorio de eventos</h2><p>Simulación educativa: no ejecuta código del usuario ni accede a AWS.</p><label>Disparador <select id="trigger"><option value="api">API Gateway</option><option value="s3">S3 - Objeto creado</option><option value="schedule">EventBridge Scheduler</option></select></label><p>Evento JSON</p><textarea id="event" spellcheck="false"></textarea><p><button id="run">▶ Invocar</button> <button id="reset">Restablecer</button></p><h3>Respuesta y logs</h3><pre id="out" aria-live="polite">Esperando invocación…</pre></div>';const ex={api:{queryStringParameters:{nombre:"Ana"}},s3:{Records:[{s3:{bucket:{name:"clase"},object:{key:"imagen.jpg"}}}]},schedule:{source:"aws.scheduler",detail:{tarea:"informe"}}};let reset=()=>{$('event').value=JSON.stringify(ex[$('trigger').value],null,2);$('out').textContent='Esperando invocación…'};$('trigger').onchange=reset;$('reset').onclick=reset;reset();$('run').onclick=()=>{try{let e=JSON.parse($('event').value),t=$('trigger').value,r;if(!e||typeof e!=='object'||Array.isArray(e))throw Error('El evento debe ser un objeto JSON');if(t==='api'){if(typeof e.queryStringParameters?.nombre!=='string')throw Error('Falta queryStringParameters.nombre');r={mensaje:'Hola '+e.queryStringParameters.nombre}}else if(t==='s3'){let x=e.Records?.[0]?.s3;if(!x?.bucket?.name||!x?.object?.key)throw Error('Faltan datos de S3');r={bucket:x.bucket.name,archivo:x.object.key}}else{if(e.source!=='aws.scheduler')throw Error('source debe ser aws.scheduler');r={procesado:true,detail:e.detail}}$('out').textContent=JSON.stringify({statusCode:200,body:r,logs:['START RequestId: demo','INFO Evento validado','END RequestId: demo']},null,2)}catch(err){$('out').textContent='ERROR: '+err.message}}}open(0);
</script></body></html>
